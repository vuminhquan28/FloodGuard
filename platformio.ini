[platformio]
default_envs = esp32dev
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main_wokwi.cpp>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

[env:hardware]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main_hardware.cpp>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
